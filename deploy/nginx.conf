# ─────────────────────────────────────────────────────────────────────────────
#  nginx for trylipi.online (the static React build)
#
#  This file exists because two of PageSpeed's findings cannot be fixed in the
#  repo: "use efficient cache lifetimes" and the compression ratio. Both are
#  response headers, and the server is the only place that can send them.
#
#  Today the server sends NO Cache-Control at all. A browser with no explicit
#  freshness lifetime falls back to a heuristic and, in practice, revalidates:
#  every repeat visitor pays a round trip per asset to be told "304, unchanged".
#  On the 150KB of hashed assets this page loads, that is the entire difference
#  between a second visit that paints instantly and one that waits on the
#  network before it can start.
#
#  Copy the marked blocks into the existing server{} block; the surrounding
#  scaffolding here is only to show where they belong.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;                        # nginx >= 1.25.1. Older: `listen 443 ssl http2;`
    server_name trylipi.online www.trylipi.online;

    # ssl_certificate / ssl_certificate_key — leave whatever certbot wrote.

    root /var/www/trylipi/build;     # ← the CRA build folder
    index index.html;

    # ── COMPRESSION ─────────────────────────────────────────────────────────
    # gzip is already on (responses carry Content-Encoding: gzip). Listed here
    # so the whole policy is in one place, and because gzip_types on many
    # distro defaults is missing application/json and svg.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;
    # Deliberately NOT in that list: woff2, png, ico. They are already
    # compressed formats; running them through gzip burns CPU to add bytes.

    # Brotli, if the module is available (`nginx -V 2>&1 | grep -o brotli`).
    # Worth roughly another 15-20% off the JavaScript over gzip, for free, on
    # every browser in use. On Debian/Ubuntu: apt install libnginx-mod-brotli
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_static     on;          # serves a precompiled .br if one sits next to the file
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ── HASHED BUILD ASSETS: CACHE FOREVER ──────────────────────────────────
    # Everything under /static/ carries a content hash in its filename
    # (main.64868863.js). A change to the file changes its name, so the old
    # URL can never go stale and there is nothing to revalidate. `immutable`
    # is the part that tells the browser not to even ask on a reload.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SELF-HOSTED FONTS ───────────────────────────────────────────────────
    # Same policy, but read this caveat: these filenames are NOT content-hashed
    # (they are copied verbatim from public/). `immutable` for a year means a
    # visitor who has the old file will not fetch a new one — so if you ever
    # replace the font, change the FILENAME (inter-latin-var-v2.woff2) and
    # update the preload + @font-face in public/index.html to match.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── ICONS AND STATIC ROOT FILES ─────────────────────────────────────────
    # logo192.png is one of the files PageSpeed flagged. Same no-hash caveat,
    # so a month rather than a year: long enough to stop the revalidation,
    # short enough that a rebrand lands without renaming anything.
    location ~* \.(?:png|ico|svg|webp|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── THE APP SHELL: NEVER CACHE ──────────────────────────────────────────
    # index.html is the index of which hashed assets exist. Cache it and a
    # deploy strands people on an HTML file pointing at bundles you deleted —
    # a white screen that only a hard refresh fixes. `no-cache` does not mean
    # "don't store", it means "revalidate before use", which is exactly right:
    # one cheap 304 on navigation, and a deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Site verification and the LLM manifest are small and change rarely.
    location = /llms.txt        { add_header Cache-Control "public, max-age=3600"; }

    # ── SPA FALLBACK ────────────────────────────────────────────────────────
    # /privacy, /terms, /app/topics and the rest are client-side routes with no
    # file behind them. Without this, a refresh or a shared link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
