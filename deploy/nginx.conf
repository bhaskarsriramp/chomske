# ─────────────────────────────────────────────────────────────────────────────
#  /etc/nginx/sites-available/lipi  on chomske-instance
#
#  A copy of the live config, kept here so the caching policy is reviewable in
#  the repo rather than only existing on one VM. nginx does not read THIS file;
#  edit the one on the server and keep this in sync.
#
#  What was added beyond the original: cache lifetimes. The build was being
#  served with no Cache-Control header at all, so every returning visitor spent
#  a round trip per asset asking "still current?" and being told yes. That is
#  the whole difference between a second visit that paints instantly and one
#  that waits on the network before it can start.
# ─────────────────────────────────────────────────────────────────────────────

# Everything on plain HTTP goes to the canonical HTTPS apex.
server {
    listen 80;
    server_name trylipi.online www.trylipi.online;
    return 301 https://trylipi.online$request_uri;
}

# www over HTTPS also goes to the apex, so there is one address for the site.
server {
    listen 443 ssl;
    server_name www.trylipi.online;

    ssl_certificate     /etc/letsencrypt/live/www.trylipi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.trylipi.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://trylipi.online$request_uri;
}

# The real site.
server {
    listen 443 ssl;
    server_name trylipi.online;

    ssl_certificate     /etc/letsencrypt/live/www.trylipi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.trylipi.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/sreeramyamini442218/chomske/build;
    index index.html;

    # ── WHY EVERY PREFIX BELOW IS `^~` ──────────────────────────────────────
    # nginx tests regex locations BEFORE prefix ones. Without `^~`, the image
    # rule further down would capture /api/whatever.png and /static/media/*.png
    # out from under the blocks that are supposed to own them: the API one
    # silently, by serving a 404 from disk instead of proxying to the backend.
    # `^~` means "if this prefix is the longest match, stop, do not try regexes".

    # ── HASHED BUILD ASSETS: CACHE FOREVER ──────────────────────────────────
    # Everything under /static/ carries a content hash in its filename
    # (main.b37d7941.js). A change to the file changes its name, so the old URL
    # can never go stale and there is nothing to revalidate. `immutable` is the
    # part that stops the browser asking even on a reload.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SELF-HOSTED FONTS ───────────────────────────────────────────────────
    # Same policy, one caveat: these filenames are NOT content-hashed (they are
    # copied verbatim out of public/). A year of `immutable` means a visitor
    # holding the old file will never fetch a new one, so if the font is ever
    # replaced, change the FILENAME (inter-latin-var-v2.woff2) and update both
    # the preload and the @font-face in public/index.html to match.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── ICONS ───────────────────────────────────────────────────────────────
    # logo192.png is one of the files PageSpeed flagged. Unhashed again, so a
    # month rather than a year: long enough to stop the revalidation, short
    # enough that a rebrand lands without renaming anything.
    # try_files =404 is deliberate: without it a missing image would fall
    # through to the SPA and answer 200 with a page of HTML.
    location ~* \.(?:png|ico|svg|webp|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── THE APP SHELL: NEVER CACHE ──────────────────────────────────────────
    # index.html is the index of WHICH hashed assets exist. Cache it and a
    # deploy strands people on an HTML file pointing at bundles that no longer
    # exist: a white screen only a hard refresh fixes. `no-cache` does not mean
    # "don't store", it means "revalidate before use": one cheap 304 per
    # navigation, and a deploy is picked up immediately.
    #
    # This also catches the SPA fallback below, because try_files' last argument
    # is an internal redirect that re-enters location matching. /privacy and
    # /app/topics therefore get this header too, which is what we want.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SPA FALLBACK ────────────────────────────────────────────────────────
    # /privacy, /terms, /app/topics and the rest are client-side routes with no
    # file behind them. Without this, a refresh or a shared link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── THE API, SAME ORIGIN ────────────────────────────────────────────────
    # The frontend is built with REACT_APP_API_URL=https://trylipi.online/api,
    # so the app and its backend share an origin. That is why index.html has no
    # preconnect for the API: the connection the document arrived on is the one
    # `GET /auth/me` reuses.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:8001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── BROTLI (optional) ───────────────────────────────────────────────────
    # gzip is already on globally in nginx.conf. Brotli is worth another ~15-20%
    # off the JavaScript and every browser in use supports it, but it needs a
    # module that is not compiled in by default:
    #     nginx -V 2>&1 | tr ' ' '\n' | grep -i brotli
    #     sudo apt install libnginx-mod-brotli
    # Uncomment only after that package installs cleanly.
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml;
    #
    # Do NOT add woff2/png/ico to brotli_types or gzip_types: they are already
    # compressed formats, so it burns CPU to add bytes.
}
