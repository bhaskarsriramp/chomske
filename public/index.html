<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F0E0C" />
    <title>Hinglish — hear what they actually said</title>
    <meta
      name="description"
      content="Paste a YouTube link and get the transcript in the language it was spoken in. Hindi stays Hindi. Hinglish stays Hinglish. Nothing gets translated."
    />

    <meta property="og:title" content="Hinglish — hear what they actually said" />
    <meta
      property="og:description"
      content="Transcripts in the language it was spoken in. Hindi stays Hindi, Telugu stays Telugu, and code-mixing stays exactly as said."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chomske.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans Devanagari/Telugu/Bengali: without these, transcripts render as
         tofu boxes on machines with no Indic fonts installed — which is most
         Windows defaults for Telugu and Bengali. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need JavaScript enabled to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
