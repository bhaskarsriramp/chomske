    <!-- Inline critical CSS for placeholder — in <head> so it paints before any blocking CSS loads -->
    <style>
      #_plh{position:fixed;inset:0;z-index:9000;background:#020617;display:flex;align-items:center;justify-content:center;padding:0 20px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity 0.15s ease}

      #_plh button{background:#25D366;color:#fff;font-size:17px;font-weight:700;padding:18px 42px;border-radius:14px;border:none;cursor:pointer}

  <body>
    <div id="_plh" aria-hidden="true">
      <div style="max-width:520px;width:100%">
        <h1>Your server is down.<br><span style="color:#25D366">Does WhatsApp know yet?</span></h1>
        <p>Paste one webhook. Get instant WhatsApp alerts for server downtime, failed payments, and critical events. No API required.</p>
        <button>Get Your Webhook →</button>
      </div>
    </div>

    <div id="root"></div>

    <!-- Remove placeholder as soon as React adds content to #root -->
    <script>
      !function(){
        var r=document.getElementById('root'),p=document.getElementById('_plh');
        if(!r||!p)return;
        var o=new MutationObserver(function(){
          if(r.hasChildNodes()){
            o.disconnect();
            requestAnimationFrame(function(){p.style.opacity='0';setTimeout(function(){p.remove();},160);});
          }
        });
        o.observe(r,{childList:true});
      }();
    </script>
  </body>
